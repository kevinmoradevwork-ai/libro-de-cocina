<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background sector gradient -->
    <radialGradient id="beamGradient" cx="50%" cy="5%" r="85%" fx="50%" fy="5%">
      <stop offset="0%" stop-color="#1f2428" />
      <stop offset="35%" stop-color="#121517" />
      <stop offset="70%" stop-color="#0a0c0e" />
      <stop offset="100%" stop-color="#030405" />
    </radialGradient>

    <!-- Baby body tissue gradient -->
    <radialGradient id="fetusGlow" cx="48%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#d4d8dc" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#a0a8b0" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#555d64" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1a1c1e" stop-opacity="0" />
    </radialGradient>

    <!-- Head glow -->
    <radialGradient id="headGlow" cx="38%" cy="40%" r="22%">
      <stop offset="0%" stop-color="#edf1f5" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#9aa2aa" stop-opacity="0.7" />
      <stop offset="85%" stop-color="#3e4348" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <!-- Ultrasound speckle noise filter -->
    <filter id="ultrasoundNoise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0.33 0.33 0.33 0 0
        0    0    0    0.35 0" in="noise" result="coloredNoise" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Monitor Frame Background -->
  <rect width="800" height="600" fill="#050709" />

  <!-- Ultrasound Sector Cone (Pie Wedge) -->
  <path d="M 400 30 L 720 540 A 480 480 0 0 1 80 540 Z" fill="url(#beamGradient)" />

  <!-- Grid / Range Markers (Concentric Arcs) -->
  <g stroke="#3a444c" stroke-width="1" stroke-dasharray="3,6" fill="none" opacity="0.45">
    <path d="M 320 160 A 135 135 0 0 1 480 160" />
    <path d="M 260 270 A 250 250 0 0 1 540 270" />
    <path d="M 190 390 A 375 375 0 0 1 610 390" />
    <path d="M 110 520 A 510 510 0 0 1 690 520" />
  </g>

  <!-- Acoustic Shadows and Uterine Wall Reflections -->
  <g filter="url(#softGlow)" opacity="0.6">
    <!-- Top uterine curve -->
    <path d="M 220 220 C 330 180, 480 190, 580 260" stroke="#7e8a94" stroke-width="7" fill="none" stroke-linecap="round" filter="blur(4px)" />
    <!-- Lower contour -->
    <path d="M 180 460 C 300 500, 500 490, 620 420" stroke="#505b63" stroke-width="6" fill="none" stroke-linecap="round" filter="blur(5px)" />
    <!-- Placenta / amniotic fluid sac edge -->
    <path d="M 200 240 C 290 210, 520 220, 590 310 C 630 380, 550 470, 420 480 C 280 490, 170 410, 170 330 Z" fill="#080b0e" stroke="#48535b" stroke-width="2" />
  </g>

  <!-- Baby Silhouette (Ultrasound Echogenic Representation) -->
  <g transform="translate(40, -10)">
    <!-- Baby Head (Cranium profile) -->
    <ellipse cx="330" cy="295" rx="58" ry="50" fill="url(#headGlow)" transform="rotate(-15 330 295)" />
    <!-- Facial profile & nose bone reflection (Echogenic Nasal Bone) -->
    <path d="M 370 280 C 382 292, 385 302, 375 308 C 382 316, 378 326, 365 332" stroke="#f0f4f8" stroke-width="4.5" fill="none" stroke-linecap="round" filter="blur(1px)" />

    <!-- Spine (Vertebral echogenic column) -->
    <path d="M 285 320 C 265 345, 260 385, 290 415 C 315 440, 355 445, 395 435" stroke="#e4ebf2" stroke-width="7" stroke-dasharray="6,4" fill="none" stroke-linecap="round" filter="blur(1.5px)" opacity="0.9" />

    <!-- Back and Tummy -->
    <ellipse cx="335" cy="375" rx="55" ry="42" fill="url(#fetusGlow)" transform="rotate(20 335 375)" />

    <!-- Tiny Arm reaching up towards face -->
    <path d="M 330 350 C 350 345, 365 335, 370 320" stroke="#d5dde4" stroke-width="5" fill="none" stroke-linecap="round" filter="blur(1px)" />
    <!-- Little hand -->
    <circle cx="370" cy="318" r="4.5" fill="#f0f5fa" filter="blur(0.8px)" />

    <!-- Tiny Leg / Thigh and Foot -->
    <path d="M 380 415 C 410 420, 425 405, 435 390" stroke="#cbd4dc" stroke-width="6.5" fill="none" stroke-linecap="round" filter="blur(1.2px)" />
    <path d="M 435 390 L 448 393" stroke="#f0f5fa" stroke-width="4" stroke-linecap="round" />

    <!-- Heartbeat locus (Active cardiac area with Doppler pulse ring) -->
    <circle cx="340" cy="345" r="12" fill="#ff5252" fill-opacity="0.15" />
    <circle cx="340" cy="345" r="5" fill="#ffffff" fill-opacity="0.85" filter="blur(1px)">
      <animate attributeName="r" values="4;7;4" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="0.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Ultrasound Noise Layer Overlay -->
  <rect x="80" y="30" width="640" height="520" fill="#fff" opacity="0.12" filter="url(#ultrasoundNoise)" pointer-events="none" />

  <!-- Caliper Measurement Markers (+ . . . . . +) -->
  <g stroke="#42d4f4" stroke-width="1.5" opacity="0.9">
    <!-- Crown-Rump Caliper -->
    <path d="M 300 250 L 300 262 M 294 256 L 306 256" />
    <path d="M 465 410 L 465 422 M 459 416 L 471 416" />
    <line x1="300" y1="256" x2="465" y2="416" stroke-dasharray="4,4" stroke="#42d4f4" opacity="0.75" />
    <text x="390" y="330" fill="#42d4f4" font-family="'Courier New', monospace" font-size="12" font-weight="bold">CRL 6.18cm</text>
  </g>

  <!-- Transducer Apex Indicator -->
  <path d="M 395 24 L 405 24 L 400 32 Z" fill="#ffeb3b" />

  <!-- Depth Scale on Right Margin -->
  <g fill="#7d8c99" font-family="'Courier New', monospace" font-size="10" text-anchor="end">
    <line x1="755" y1="80" x2="765" y2="80" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="84">2</text>
    <line x1="755" y1="160" x2="765" y2="160" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="164">4</text>
    <line x1="755" y1="240" x2="765" y2="240" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="244">6</text>
    <line x1="755" y1="320" x2="765" y2="320" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="324">8</text>
    <line x1="755" y1="400" x2="765" y2="400" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="404">10</text>
    <line x1="755" y1="480" x2="765" y2="480" stroke="#7d8c99" stroke-width="1.5" />
    <text x="750" y="484">12</text>
    <line x1="760" y1="60" x2="760" y2="500" stroke="#7d8c99" stroke-width="1" />
    <text x="778" y="290" transform="rotate(90 778 290)">[ cm ]</text>
  </g>

  <!-- Medical UI OSD (On-Screen Display) -->
  <g fill="#e0e8f0" font-family="'Courier New', Courier, monospace" font-weight="600">
    <!-- Top Left Clinic & Doctor Info -->
    <text x="24" y="34" font-size="14" letter-spacing="1">HOSPITAL MATERNO FAMILIAR</text>
    <text x="24" y="52" font-size="12" fill="#8ca0b3">DPTO. GINECOLOGÍA Y OBSTETRICIA</text>
    
    <!-- Top Right Telemetry -->
    <text x="776" y="34" font-size="12" text-anchor="end" fill="#b0c0d0">MI 0.9  TIS 0.3</text>
    <text x="776" y="50" font-size="11" text-anchor="end" fill="#7a8c9e">3.5MHz / OB-1</text>

    <!-- Patient Info Line -->
    <text x="24" y="80" font-size="13" fill="#ffe599">PACIENTE: LA MEJOR ABUELITA DEL MUNDO</text>
    <text x="24" y="98" font-size="12" fill="#a4b4c4">ID: BEBE-EN-CAMINO-2026</text>

    <!-- Vital Stats / Fetal Measurements -->
    <g transform="translate(24, 480)" font-size="12">
      <rect x="0" y="0" width="220" height="85" fill="#0c1014" fill-opacity="0.8" rx="4" stroke="#25313d" />
      <text x="12" y="22" fill="#8ef0aa">♥ FHR: 156 bpm (Normal)</text>
      <text x="12" y="40" fill="#ffffff">EDAD GEST.: 12 Semanas</text>
      <text x="12" y="58" fill="#ffffff">F. ESTIMADA: 14 DE JUNIO</text>
      <text x="12" y="74" fill="#ffd166">ESTADO: Sano y Fuerte</text>
    </g>

    <!-- Warm Loving Message inside scan -->
    <g transform="translate(520, 520)" font-size="12" text-anchor="middle">
      <rect x="-140" y="-18" width="280" height="32" fill="#000" fill-opacity="0.85" rx="16" stroke="#4a5568" />
      <text x="0" y="4" fill="#ffffff">¡Hola Abuelita! Te veo muy pronto ♥</text>
    </g>
  </g>
</svg>
